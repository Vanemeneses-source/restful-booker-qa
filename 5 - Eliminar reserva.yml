info:
  name: 5 - Eliminar reserva
  type: http
  seq: 5

http:
  method: DELETE
  url: "{{baseUrl}}/booking/{{bookingId}}"
  headers:
    - name: Cookie
      value: token={{token}}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "201"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
