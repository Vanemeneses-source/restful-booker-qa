info:
  name: "3 - Consultar reserva "
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/booking/{{bookingId}}"
  headers:
    - name: Accept
      value: application/json
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.firstname
      operator: eq
      value: Ana

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
