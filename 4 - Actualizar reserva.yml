info:
  name: 4 - Actualizar reserva
  type: http
  seq: 4

http:
  method: PUT
  url: "{{baseUrl}}/booking/{{bookingId}}"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
    - name: Cookie
      value: "token={{token}} "
  body:
    type: json
    data: |-
      {"firstname": "Ana Maria",
        "lastname": "Perez",
        "totalprice": 200,
        "depositpaid": true,
        "bookingdates": { "checkin": "2026-12-01", "checkout": "2026-12-05" },
        "additionalneeds": "Desayuno"}
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
