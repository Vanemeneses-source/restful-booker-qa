info:
  name: 2 - Crear reserva
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/booking"
  headers:
    - name: Content-Type
      value: application/json
    - name: Accept
      value: application/json
  body:
    type: json
    data: |-
      {"firstname": "Ana",
        "lastname": "Perez",
        "totalprice": 150,
        "depositpaid": true,
        "bookingdates": { "checkin": "2026-12-01", "checkout": "2026-12-05" },
        "additionalneeds": "Desayuno"}
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("la reserva devuelve los campos obligatorios", function () {
          const booking = res.body.booking;
          ["firstname", "lastname", "totalprice", "depositpaid", "bookingdates"]
            .forEach((campo) => expect(booking).to.have.property(campo));
        });
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.booking.firstname
      operator: eq
      value: Ana
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.bookingid
        method: jsonq
      variable:
        name: bookingId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
