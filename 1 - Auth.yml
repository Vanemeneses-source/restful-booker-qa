info:
  name: 1 - Auth
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/auth"
  body:
    type: json
    data: |
      {"username": "admin",
      "password": "password123"}
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.token
        method: jsonq
      variable:
        name: token
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
